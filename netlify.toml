[build]
  publish = "."

[build.environment]
  GIT_SUBMODULES = "true"

# --- Redirect & Rewrite Rules ---

# 1. Route Plumber Traffic First
[[redirects]]
  from = "/plumber/*"
  to = "/plumber/:splat"
  status = 200

# 2. Route Electrical Traffic Second
[[redirects]]
  from = "/electrical/*"
  to = "/electrical/:splat"
  status = 200

# 3. Catch-all: Route everything else (Root / Main Site) to the Emergency module
[[redirects]]
  from = "/*"
  to = "/emergency/:splat"
  status = 200
